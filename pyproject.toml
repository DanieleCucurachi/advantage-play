[project]
name = "advantage-play"
version = "0.1.0"
description = "A research workspace for strategy experiments in standard-deck card games."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.8,<1.4",
]

[build-system]
requires = ["hatchling>=1.33,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17.3,<0.18",
]

[project.urls]
Repository = "https://github.com/DanieleCucurachi/advantage-play"
Issues = "https://github.com/DanieleCucurachi/advantage-play/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/advantage_play"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
