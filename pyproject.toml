[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "advantage-play"
version = "0.1.0"
description = "A framework to define card games, plug in strategies, and simulate them at scale to find optimal play."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Daniele Cucurachi", email = "daniele.cucurachi@planqc.eu" }]
keywords = ["cards", "blackjack", "game-theory", "monte-carlo", "simulation", "strategy", "hydra"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "hydra-core>=1.3.2",
    "omegaconf>=2.3",
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "rich>=13.7",
]

# Console entry points will be declared here once the CLI exists, e.g.:
# [project.scripts]
# advantage-play = "advantage_play.cli:main"

[project.urls]
Repository = "https://github.com/OWNER/advantage-play"
Issues = "https://github.com/OWNER/advantage-play/issues"
Changelog = "https://github.com/OWNER/advantage-play/blob/main/CHANGELOG.md"

# --- Dependency groups (PEP 735) — managed with `uv sync` / `uv add --group` ---
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "scipy-stubs>=1.14",
    "pre-commit>=4.0",
]
notebooks = [
    "jupyterlab>=4.3",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "nbstripout>=0.8",
    "seaborn>=0.13",
]
docs = [
    "sphinx>=8.1",
    "furo>=2024.8",
    "myst-parser>=4.0",
    "sphinx-autodoc-typehints>=2.5",
    "sphinx-autobuild>=2024.10",
]
parallel = [
    # Enables `hydra/launcher=joblib` for parallel multiruns (sweeps over games/strategies).
    "hydra-joblib-launcher>=1.2",
]

[tool.uv]
default-groups = ["dev"]

# --- Build ---
[tool.hatch.build.targets.wheel]
packages = ["src/advantage_play"]

[tool.hatch.build.targets.sdist]
include = ["src/advantage_play", "conf", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "D",        # pydocstyle
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "SIM",      # simplify
    "PT",       # pytest style
    "RET",      # return consistency
    "TC",       # type-checking imports
    "NPY",      # numpy
    "PD",       # pandas
    "PERF",     # performance
    "RUF",      # ruff-specific
]
ignore = [
    "D105",     # magic method docstrings
    "D107",     # __init__ docstrings (document on the class)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["advantage_play"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"examples/**" = ["D", "E402", "T20"]
"docs/conf.py" = ["D", "A001"]

[tool.ruff.format]
docstring-code-format = true

# --- Mypy ---
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["hydra.*", "omegaconf.*"]
ignore_missing_imports = true

# --- Pytest ---
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "slow: long-running tests (large Monte Carlo runs); deselect with -m 'not slow'",
    "statistical: tests asserting on statistical properties (seeded, tolerance-based)",
]

# --- Coverage ---
[tool.coverage.run]
source = ["advantage_play"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.$",
]
